<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ทะเบียนสินทรัพย์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky ledger bar with tabs, one working column, a right-side drawer for each asset */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#eaf0ee; --ink:#16211d; --muted:#5a6a64; --line:#dbe3e0;
  --accent:#1c6a56; --accent-ink:#ffffff; --accent-soft:#dfeee8;
  --good:#2b7a49; --warn:#9a5a12; --bad:#b03636; --warn-soft:#fbefdf; --bad-soft:#f9e4e4;
  --shadow:0 12px 40px rgba(20,40,34,.18);
  --BD-bg:#e9eaec; --BD-fg:#4a4f57; --OF-bg:#fbe3d3; --OF-fg:#a2521c; --FF-bg:#dcefd3; --FF-fg:#3d7a2a; --KT-bg:#d8e9f8; --KT-fg:#23639e; --VH-bg:#dce6ea; --VH-fg:#3f5f6b; --SW-bg:#e8def5; --SW-fg:#6a4a9a; --CP-bg:#f8dcdc; --CP-fg:#a33a3a; --CS-bg:#f4ecd0; --CS-fg:#7a6212;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --sunk:#1b2521; --ink:#e4ebe8; --muted:#97a6a0; --line:#2a3632;
  --accent:#62c2a2; --accent-ink:#0b1a15; --accent-soft:#1c3029;
  --good:#7fd09c; --warn:#e3a764; --bad:#f08c8c; --warn-soft:#33281a; --bad-soft:#3a2020;
  --shadow:0 12px 40px rgba(0,0,0,.5); --BD-bg:#262a30; --BD-fg:#c3c8d0; --OF-bg:#3a2a1f; --OF-fg:#f2b48a; --FF-bg:#22331d; --FF-fg:#a8d898; --KT-bg:#1c2b3a; --KT-fg:#9cc8f0; --VH-bg:#1f2b30; --VH-fg:#a9c5cf; --SW-bg:#2c2438; --SW-fg:#c9b2ef; --CP-bg:#3a2222; --CP-fg:#f0a3a3; --CS-bg:#33301c; --CS-fg:#e3d08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --sunk:#1b2521; --ink:#e4ebe8; --muted:#97a6a0; --line:#2a3632;
  --accent:#62c2a2; --accent-ink:#0b1a15; --accent-soft:#1c3029;
  --good:#7fd09c; --warn:#e3a764; --bad:#f08c8c; --warn-soft:#33281a; --bad-soft:#3a2020;
  --shadow:0 12px 40px rgba(0,0,0,.5); --BD-bg:#262a30; --BD-fg:#c3c8d0; --OF-bg:#3a2a1f; --OF-fg:#f2b48a; --FF-bg:#22331d; --FF-fg:#a8d898; --KT-bg:#1c2b3a; --KT-fg:#9cc8f0; --VH-bg:#1f2b30; --VH-fg:#a9c5cf; --SW-bg:#2c2438; --SW-fg:#c9b2ef; --CP-bg:#3a2222; --CP-fg:#f0a3a3; --CS-bg:#33301c; --CS-fg:#e3d08a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.demo-tag{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:99px}
main{padding-block:24px 64px;display:grid;gap:24px}
h1{font-size:24px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.spread{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:12px}
main>*{min-width:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi strong{display:block;font-size:clamp(17px,4.6vw,22px);overflow-wrap:anywhere;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.code{font-family:var(--f-mono);font-weight:600;font-size:13.5px;letter-spacing:.01em;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;background:var(--sunk)}
.ph{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;white-space:nowrap}
.p-active{background:var(--accent-soft);color:var(--accent)}
.p-cip{background:var(--warn-soft);color:var(--warn)}
.p-off{background:var(--sunk);color:var(--muted)}
.p-full{background:var(--bad-soft);color:var(--bad)}
.ex{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:500;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.alert{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.warnbox{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px 5px 5px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.chip .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.chip .ic svg{width:18px;height:18px}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.acard .meta{padding:10px}.acard .mrow b{font-size:13px}nav{flex-basis:100%;order:3}.brand span{display:none}}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;transition:border-color .15s, transform .15s}
.acard:hover{border-color:var(--accent);transform:translateY(-2px)}
.art{aspect-ratio:4/3;width:100%;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{width:40%;height:auto}
.art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.art .tag{position:absolute;top:10px;left:10px;font-family:var(--f-mono);font-weight:600;font-size:12.5px;background:var(--surface);color:var(--ink);padding:3px 8px;border-radius:6px;z-index:1}
.art .st{position:absolute;top:10px;right:10px;z-index:1}
.acard .meta{padding:12px 14px 14px;display:grid;gap:6px}
.acard .nm{font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.acard .br{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.acard .mrow small{font-size:12px;color:var(--muted)}
.acard .mrow b{font-weight:600;font-variant-numeric:tabular-nums}
.cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px}
.ctile{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ctile:hover{border-color:var(--accent)}
.ctile .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.ctile .ic svg{width:32px;height:32px}
.ctile .t{min-width:0;display:grid;gap:2px}
.ctile .t span{font-size:13px;color:var(--muted)}
.ctile .t strong{font-size:18px;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px}
.blist{display:grid;gap:12px}
.bitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px;cursor:pointer}
.bitem .meter{grid-column:1/-1;margin-top:0}
.bitem b{font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.more{display:flex;justify-content:center}
.heroart{border-radius:12px;aspect-ratio:auto;height:200px}
.heroart svg{width:26%}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.dbody{overflow-y:auto;padding:20px;display:grid;gap:20px;align-content:start}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
.bigcode{font-family:var(--f-mono);font-size:22px;font-weight:600}
.gallery{display:grid;gap:10px}
.mainimg{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:12px;background:var(--sunk);display:block}
.noimg{min-height:120px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px;background:var(--surface)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.tw{position:relative}
.tw img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block;border:2px solid transparent;cursor:pointer}
.tw.primary img{border-color:var(--accent)}
.tw .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--bad);font-size:13px;line-height:1;cursor:pointer;padding:0}
.upl{display:inline-flex;align-items:center;gap:6px}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
dl.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin:0}
dl.facts div{min-width:0}
dl.facts dt{font-size:12px;color:var(--muted)}
dl.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.label{display:flex;gap:12px;align-items:center;border:1px solid var(--ink);border-radius:6px;padding:10px 12px;width:min(340px,100%);background:#fff;color:#111}
.label .qr svg{width:84px;height:84px;display:block}
.label .t{display:grid;gap:2px;min-width:0}
.label .t small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#555}
.label .t b{font-family:var(--f-mono);font-size:17px}
.label .t span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px}
.hist li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.jv td:first-child{width:56px;color:var(--muted)}
.jv .cr td:nth-child(2){padding-left:32px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

.cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:2px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center}.cnt:empty{display:none}
.pqhead{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.pq td .note{font-size:12.5px}
.pq .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.prbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.prbtn i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.prbtn[data-state="on"] i{background:var(--good)}
.prbtn[data-state="busy"] i{background:var(--warn)}
.lblprev{display:block;width:min(340px,100%);height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;image-rendering:pixelated}
.prrow{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:10px}
.prrow .f{width:110px}
.empty{text-align:center;padding:40px 20px;display:grid;gap:12px;justify-items:center}
.empty h2{margin:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
</style>

</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><b>ทะเบียนสินทรัพย์</b><span>Fixed Asset Register</span></div>
    <nav id="nav">
      <button data-view="overview">ภาพรวม</button>
      <button data-view="register">ทะเบียน</button>
      <button data-view="pending">รอขึ้นทะเบียน <b class="cnt" id="pcnt"></b></button>
      <button data-view="dep">ค่าเสื่อมราคา</button>
      <button data-view="settings">ตั้งค่า</button>
    </nav>
    <span class="prbtn" id="sync" data-state="busy" title="สถานะการบันทึกลง Google Sheet"><i></i><span>กำลังโหลด…</span></span>
  </div>
</header>
<main class="wrap" id="app"><section class="card empty"><h2>กำลังเริ่มระบบ…</h2><p class="note" id="bootnote">ถ้าค้างที่ข้อความนี้นาน แคปหน้าจอส่งให้ผู้ดูแลระบบ</p></section></main>
<script>(function(){function show(t){var a=document.getElementById("app");if(a)a.innerHTML='<section class="card"><h2>เกิดข้อผิดพลาดในหน้าเว็บ</h2><p class="note">แคปหน้าจอนี้ส่งให้ผู้ดูแลระบบ</p><pre style="white-space:pre-wrap;font-size:12px">'+String(t).replace(/[<&]/g,function(c){return c=="<"?"&lt;":"&amp;";})+'</pre></section>';}window.addEventListener("error",function(e){show((e.message||e)+" @ "+e.lineno+":"+e.colno);});window.addEventListener("unhandledrejection",function(e){show("Promise: "+(e.reason&&e.reason.message||e.reason));});})();</script>
<div id="layer"></div>
<div id="toast" hidden></div>

    const acc = accDep(a, y + '-12-31'); const dep = r2(acc - prev);
    if (dep <= 0 && y > y0) break;
    rows.push({y, dep, acc, nbv: r2(a.cost - acc)}); prev = acc;
  }
  return rows;
}

function vDep(){
  const ym = ui.month, endD = monthEnd(ym), prevD = prevMonthEnd(ym);
  const lines = state.assets.map(a => ({a, dep: r2(accDep(a,endD) - accDep(a,prevD)), acc: accDep(a,endD)})).filter(x => x.dep > 0)
    .sort((x,y)=>x.a.code.localeCompare(y.a.code));
  const total = lines.reduce((s,x)=>s+x.dep,0);
  const byCat = state.cats.map(c => ({c, dep: r2(lines.filter(x=>x.a.cat===c.code).reduce((s,x)=>s+x.dep,0))})).filter(x=>x.dep>0);
  const closed = state.closed.includes(ym);
  const word = c => c.code === 'SW' ? 'ค่าตัดจำหน่าย' : 'ค่าเสื่อมราคา';
  return `
  <div class="spread"><div><h1>ค่าเสื่อมราคาประจำเดือน</h1><p class="sub">${thMonth(ym)} · ${lines.length} รายการ · รวม ${fmt(total)} บาท ${closed?'<span class="pill p-active">ปิดงวดแล้ว</span>':''}</p></div>
    <div class="row"><label class="f" style="width:180px">งวด<input type="month" id="month" value="${ym}"></label>
    <button class="btn ${closed?'':'pri'}" data-act="close">${closed?'เปิดงวดอีกครั้ง':'ปิดงวด'}</button></div></div>
  <div class="split">
    <section class="card" style="padding:4px 8px"><div class="scroll"><table>
      <thead><tr><th>รหัสทรัพย์สิน</th><th>ชื่อ</th><th class="n">ค่าเสื่อมเดือนนี้</th><th class="n">สะสมสิ้นเดือน</th><th class="n">มูลค่าสุทธิ</th></tr></thead>
      <tbody>${lines.map(x=>`<tr class="click" data-open="${x.a.id}"><td class="code">${esc(x.a.code)}</td><td>${esc(x.a.name)}</td><td class="n">${fmt(x.dep)}</td><td class="n">${fmt(x.acc)}</td><td class="n">${fmt(x.a.cost-x.acc)}</td></tr>`).join('') || '<tr><td colspan="5" class="note" style="padding:24px;text-align:center">ไม่มีค่าเสื่อมในงวดนี้</td></tr>'}</tbody>
      <tfoot><tr><td colspan="2">รวม</td><td class="n">${fmt(total)}</td><td></td><td></td></tr></tfoot>
    </table></div></section>
    <section class="card"><h2>รายการบันทึกบัญชี (JV) ที่จะส่งเข้าระบบบัญชี</h2>
      <p class="note" style="margin:0 0 10px">ลงวันที่ ${thDate(endD)} · แยกตามหมวด</p>
      <div class="scroll"><table class="jv"><thead><tr><th></th><th>บัญชี</th><th class="n">เดบิต</th><th class="n">เครดิต</th></tr></thead><tbody>
      ${byCat.map(x=>`<tr><td>Dr</td><td>${word(x.c)} – ${esc(x.c.name)}</td><td class="n">${fmt(x.dep)}</td><td></td></tr>
        <tr class="cr"><td>Cr</td><td>${word(x.c)}สะสม – ${esc(x.c.name)}</td><td></td><td class="n">${fmt(x.dep)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td></td><td>รวม</td><td class="n">${fmt(total)}</td><td class="n">${fmt(total)}</td></tr></tfoot></table></div>
      <p class="note" style="margin:12px 0 0">รหัสบัญชีค่าเสื่อมและค่าเสื่อมสะสมของแต่ละหมวดจะผูกในหน้าตั้งค่าเมื่อทำระบบจริง แล้วส่งเข้า TRCloud เป็น JV</p>
    </section>
  </div>`;
}

/* ---------- drawer ---------- */
let drawer = null; // {mode, id, pending:[]}
function openDrawer(mode, id){ drawer = {mode, id, pending:[]}; renderDrawer(); }
function closeDrawer(){ drawer = null; $('#layer').innerHTML = ''; }
function renderDrawer(){
  if (!drawer) return;
  const a = state.assets.find(x => x.id === drawer.id);
  let head = '', body = '', foot = '';
  if (drawer.mode === 'detail'){ [head, body, foot] = dDetail(a); }
  else if (drawer.mode === 'form'){ [head, body, foot] = dForm(a); }
  else if (drawer.mode === 'transfer'){ [head, body, foot] = dTransfer(a); }
  else if (drawer.mode === 'dispose'){ [head, body, foot] = dDispose(a); }
  else if (drawer.mode === 'capitalize'){ [head, body, foot] = dCapitalize(a); }
  else if (drawer.mode === 'pnew'){ [head, body, foot] = dPendingNew(); }
  $('#layer').innerHTML = `<div class="scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true">
    <div class="dhead"><div style="min-width:0">${head}</div><button class="btn sm" data-act="close-drawer" aria-label="ปิด">ปิด</button></div>
    <div class="dbody">${body}</div>${foot?`<div class="dfoot">${foot}</div>`:''}</aside>`;
  if (drawer.mode === 'detail') drawPreview(a);
}
function drawQR(a){
  const box = $('#qrbox'); if (!box) return;
  try { const q = qrcode(0, 'M'); q.addData(a.code); q.make(); box.innerHTML = q.createSvgTag({cellSize:3, margin:0, scalable:true}); }
  catch(e){ box.innerHTML = '<div class="note">QR</div>'; }
}

function readPhoto(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res({id:'p'+Date.now()+Math.random().toString(36).slice(2,6), src:c.toDataURL('image/jpeg', .72), primary:false});
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function readPhotos(files){ const out = []; for (const f of files){ try{ out.push(await readPhoto(f)); }catch(e){ toast('อ่านรูปไม่ได้: ' + f.name); } } return out; }


/* ---------- label printing (NIIMBOT over Web Bluetooth) ---------- */
const L = () => (state.label = Object.assign({size:'50x30', density:3, type:1, task:'auto'}, state.label || {}));
const labelSizeText = () => L().size === '50x30' ? '50 × 30 มม.' : '50 × 15 มม. 2 ดวงต่อแผ่น';
const PX = 8; // 203 dpi ≈ 8 dots per mm
const PR = {client:null, busy:false, name:''};
const F_TH = '"IBM Plex Sans Thai", Tahoma, sans-serif', F_MONO = '"IBM Plex Mono", "Courier New", monospace';

async function fontsReady(list){
  const txt = list.map(a => [a.code, a.name, a.branch].join(' ')).join(' ') + ' ทรัพย์สินของบริษัท';
  try { await Promise.all(['400 18px ' + F_TH, '600 18px ' + F_TH, '600 24px ' + F_MONO].map(f => document.fonts.load(f, txt))); } catch(e) {}
}
function fitText(ctx, text, maxW, size, weight, family, min){
  let s = size; ctx.font = `${weight} ${s}px ${family}`;
  while (s > min && ctx.measureText(text).width > maxW){ s--; ctx.font = `${weight} ${s}px ${family}`; }
  return s;
}
function ellipsize(ctx, text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  const parts = Array.from(text); while (parts.length && ctx.measureText(parts.join('') + '…').width > maxW) parts.pop();
  return parts.join('') + '…';
}
function wrapLines(ctx, text, maxW, maxLines){
  const seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? Array.from(new Intl.Segmenter('th', {granularity:'word'}).segment(text), x => x.segment) : text.split(/(\s+)/);
  const lines = []; let line = '';
  for (let i = 0; i < seg.length; i++){
    const tryL = line + seg[i];
    if (ctx.measureText(tryL).width <= maxW || !line){ line = tryL; continue; }
    lines.push(line.trim()); line = seg[i].trimStart();
    if (lines.length === maxLines - 1){ line = seg.slice(i).join('').trim(); break; }
  }
  if (line) lines.push(line.trim());
  if (lines.length > maxLines) lines.length = maxLines;
  const last = lines.length - 1; if (last >= 0) lines[last] = ellipsize(ctx, lines[last], maxW);
  return lines;
}
function drawQRAt(ctx, text, x, y, size){
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), cell = Math.floor(size / n), off = Math.floor((size - cell * n) / 2);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) ctx.fillRect(x + off + c*cell, y + off + r*cell, cell, cell);
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }

/* Full label 50×30 mm: border, QR left, four text lines right (same design as the sample sticker). */
function drawFull(ctx, a, ox, oy){
  const W = 50*PX, H = 30*PX;
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; roundRect(ctx, ox+14+1.5, oy+14+1.5, W-28-3, H-28-3, 14); ctx.stroke();
  const q = 140, qx = ox + 14 + 3 + 12, qy = oy + (H - q)/2;
  drawQRAt(ctx, a.code, qx, qy, q);
  const tx = qx + q + 12, tw = ox + W - 14 - 3 - 10 - tx;
  ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
  ctx.font = `400 17px ${F_TH}`; const small = ellipsize(ctx, 'ทรัพย์สินของบริษัท', tw);
  const cs = fitText(ctx, a.code, tw, 25, 600, F_MONO, 16);
  ctx.font = `400 19px ${F_TH}`; const nm = wrapLines(ctx, a.name || '', tw, 2);
  ctx.font = `600 18px ${F_TH}`; const br = ellipsize(ctx, a.branch || '', tw);
  const lh = [24, cs + 8, ...nm.map(() => 24), 24], total = lh.reduce((x,y)=>x+y, 0) + 6;
  let y = oy + (H - total)/2;
  ctx.font = `400 17px ${F_TH}`; y += lh[0]; ctx.fillText(small, tx, y - 6);
  ctx.font = `600 ${cs}px ${F_MONO}`; y += lh[1]; ctx.fillText(a.code, tx, y - 7);
  ctx.font = `400 19px ${F_TH}`; nm.forEach(l => { y += 24; ctx.fillText(l, tx, y - 5); });
  ctx.font = `600 18px ${F_TH}`; y += 24 + 6; ctx.fillText(br, tx, y - 5);
}
/* Compact label 50×15 mm: QR left, code / name / branch right. */
function drawCompact(ctx, a, ox, oy){
  const W = 50*PX, H = 15*PX, q = 96, qx = ox + 14, qy = oy + (H - q)/2;
  drawQRAt(ctx, a.code, qx, qy, q);
  const tx = qx + q + 12, tw = ox + W - 12 - tx;
  ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
  const cs = fitText(ctx, a.code, tw, 26, 600, F_MONO, 16);
  ctx.fillText(a.code, tx, oy + 38);
  ctx.font = `400 18px ${F_TH}`; ctx.fillText(ellipsize(ctx, a.name || '', tw), tx, oy + 68);
  ctx.font = `600 16px ${F_TH}`; ctx.fillText(ellipsize(ctx, a.branch || '', tw), tx, oy + 96);
}
/* One printed page = 50×30 mm. Full: one asset. Compact: two assets stacked. */
function pageCanvas(items){
  const c = document.createElement('canvas'); c.width = 50*PX; c.height = 30*PX;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  if (L().size === '50x30') drawFull(ctx, items[0], 0, 0);
  else items.forEach((a, i) => a && drawCompact(ctx, a, 0, i * 15*PX));
  // thermal printers have no grey: threshold to pure black / white
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4){ const v = (d[i]*299 + d[i+1]*587 + d[i+2]*114) / 1000 < 150 ? 0 : 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
  ctx.putImageData(img, 0, 0);
  return c;
}
function pagesFor(list){
  if (L().size === '50x30') return list.map(a => [a]);
  const out = []; for (let i = 0; i < list.length; i += 2) out.push([list[i], list[i+1]]); return out;
}
async function drawPreview(a){
  const cv = $('#lblprev'); if (!cv) return;

  const pc = pieces(a); const src = pageCanvas(L().size === '50x30' ? [pc[0]] : [pc[0], pc[1] || pc[0]]);
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(src, 0, 0);
}

function btSupportMsg(){
  if (!window.isSecureContext) return 'ต้องเปิดเว็บผ่าน https จึงจะใช้ Bluetooth ได้';
  if (!navigator.bluetooth) return 'เบราว์เซอร์นี้ใช้ Bluetooth ไม่ได้ ให้เปิดด้วย Chrome หรือ Edge บนคอมพิวเตอร์หรือ Android (iPhone/iPad ใช้ไม่ได้)';
  if (!window.niimbluelib) return 'โหลดตัวเชื่อมต่อเครื่องพิมพ์ไม่สำเร็จ ลองรีเฟรชหน้า';
  return '';
}
async function connectPrinter(){
  const msg = btSupportMsg(); if (msg){ toast(msg); return false; }
  const client = new niimbluelib.NiimbotBluetoothClient();
  client.on('disconnect', () => { PR.client = null; PR.name = ''; updPr(); });
  try {
    const info = await client.connect();
    PR.client = client;
    const meta = client.getModelMetadata();
    PR.name = (meta && meta.model) || (info && info.deviceName) || 'NIIMBOT';
    updPr(); toast('เชื่อมต่อ ' + PR.name + ' แล้ว');
    return true;
  } catch(e){
    console.error(e); PR.client = null; updPr();
    if (!/cancel|chosen/i.test(String(e && e.message))) toast('เชื่อมต่อไม่สำเร็จ: ' + (e && e.message || e));
    return false;
  }
}
async function togglePrinter(){

    <tbody>${rows.map(p => `<tr>
      <td style="white-space:nowrap">${thDate(p.acqDate)}</td>
      <td>${esc(p.name)}${p.qty>1?` <span class="note">× ${p.qty} ${esc(p.unit||'ชิ้น')}</span>`:''}${p.cat!=='CS' && p.cost/(p.qty||1) < state.threshold ? '<span class="ex" style="color:var(--warn)">ต่ำกว่าเกณฑ์</span>' : ''}<div class="note">${esc(p.vendor||'')}${p.accName ? ' · ' + esc(p.accName) : ''}</div></td>
      <td>${esc(p.branch||'')}</td>
      <td class="code" style="font-weight:500">${(p.refs||[]).map(esc).join('<br>')}</td>
      <td class="n">${fmt(p.cost)}</td>
      <td><span class="code">${esc(p.cat||'')}</span></td>
      <td><div class="acts"><button class="btn sm pri" data-reg="${p.pid}">ขึ้นทะเบียน</button><button class="btn sm" data-rej="${p.pid}">ไม่ขึ้นทะเบียน</button></div></td></tr>`).join('')}</tbody>
  </table></div></section>`}
  ${rej.length ? `<section class="card"><h2>ไม่ขึ้นทะเบียน (${rej.length})</h2><div class="scroll"><table>
    <thead><tr><th>รายการ</th><th>เอกสาร</th><th class="n">จำนวนเงิน</th><th>เหตุผล</th><th></th></tr></thead>
    <tbody>${rej.map(p => `<tr><td>${esc(p.name)}<div class="note">${esc(p.branch||'')}</div></td><td class="code" style="font-weight:500">${(p.refs||[]).map(esc).join(', ')}</td><td class="n">${fmt(p.cost)}</td><td>${esc(p.rejReason)}<div class="note">${thDate(p.rejDate)}</div></td><td><button class="btn sm" data-unrej="${p.pid}">นำกลับเข้าคิว</button></td></tr>`).join('')}</tbody>
  </table></div></section>` : ''}`;
}
function dPendingNew(){
  const head = `<div style="font-weight:600;font-size:18px">เพิ่มรายการรอขึ้นทะเบียน</div><div class="note">ยังไม่ออกรหัส จะออกรหัสเมื่อกดขึ้นทะเบียน</div>`;
  const body = `<div class="grid2">
    <label class="f" style="grid-column:1/-1">รายการ<input id="p-name" placeholder="เช่น ตู้แช่ 2 ประตู สาขาสีลม"></label>
    <label class="f">หมวดที่แนะนำ<select id="p-cat">${state.cats.map(c=>`<option value="${c.code}">${c.code} · ${esc(c.name)}</option>`).join('')}</select></label>
    <label class="f">วันที่ได้มา<input type="date" id="p-date" value="${today}"></label>
    <label class="f">สาขา / ที่ตั้ง<input id="p-branch" list="branchlist2"><datalist id="branchlist2">${state.branches.map(b=>`<option value="${esc(b)}">`).join('')}</datalist></label>
    <label class="f">ราคาทุน (บาท ไม่รวม VAT)<input type="number" id="p-cost" min="0" step="0.01"></label>
    <label class="f">ผู้ขาย<input id="p-vendor"></label>
    <label class="f">เลขที่เอกสาร (AP / PV / ใบกำกับ)<input id="p-ref"></label>
    <label class="f" style="grid-column:1/-1">หมายเหตุ<textarea id="p-note" rows="2"></textarea></label></div>`;
  return [head, body, `<button class="btn" data-act="close-drawer">ยกเลิก</button><button class="btn pri" data-act="save-pending">เพิ่มเข้าคิว</button>`];
}
function savePending(){
  const name = $('#p-name').value.trim(), cost = parseFloat($('#p-cost').value);
  if (!name) return toast('กรอกรายการ');
  if (!(cost > 0)) return toast('ราคาทุนต้องมากกว่า 0');
  const ref = $('#p-ref').value.trim();
  state.pqseq = (state.pqseq || 0) + 1;
  PQ().push({pid:'m' + Date.now().toString(36) + state.pqseq, cat:$('#p-cat').value, name, acqDate:$('#p-date').value || today, branch:addBranch($('#p-branch').value),
    cost, vendor:$('#p-vendor').value.trim(), invoice:'', refs: ref ? [ref] : [], note:$('#p-note').value.trim()});
  save(); closeDrawer(); state.view = 'pending'; render(); toast('เพิ่มเข้าคิวรอขึ้นทะเบียนแล้ว');
}


function saveCount(){
  const a = cur(), q = parseInt($('#cnt-qty').value, 10), d = $('#cnt-date').value || today;
  if (!(q >= 0)) return toast('กรอกจำนวนคงเหลือ');
  a.counts = a.counts || []; a.counts.push({date: d, qty: q});
  const used = (+a.qty || 1) - q;
  a.history.push({date: d, text: `ตรวจนับคงเหลือ ${q} ${a.unit || 'ชิ้น'}` + (used > 0 ? ` ใช้ไป ${used} มูลค่า ${fmt(used * unitCost(a))} บาท` : '')});
  save(); renderDrawer(); render(); toast('บันทึกผลนับแล้ว');
}

/* ---------- import / backup ---------- */
async function importFile(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch(e){ return toast('อ่านไฟล์ไม่ได้ ต้องเป็นไฟล์ .json'); }
  if (data && data.format === 'fa-register-import' && Array.isArray(data.assets)){
    const incoming = Array.isArray(data.pending) ? data.pending : [];
    if (state.assets.length || PQ().length){
      const seen = new Set(); state.assets.forEach(a => (a.refs||[]).forEach(r => seen.add(r)));
      PQ().concat(state.rejected||[]).forEach(p => (p.refs||[]).forEach(r => seen.add(r)));
      const fresh = incoming.filter(p => !(p.refs||[]).some(r => seen.has(r)));
      fresh.forEach(p => { p.pid = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); });
      PQ().push(...fresh); save(); render();
      return toast(fresh.length ? 'เพิ่มรายการใหม่เข้าคิวรอขึ้นทะเบียน ' + fresh.length + ' รายการ' : 'ไม่มีรายการใหม่ ทุกเอกสารในไฟล์มีอยู่แล้ว');
    }
    TR = data.assets; TR_SKIPPED = Array.isArray(data.skipped) ? data.skipped : []; TR_PENDING = incoming;
    state = seed(); save(); render(); toast('นำเข้า ' + state.assets.length + ' รายการ และรอขึ้นทะเบียน ' + PQ().length + ' รายการ');
  } else if (false && data && data.format === 'fa-register-backup' && data.state && Array.isArray(data.state.assets)){
    if (state.assets.length && !confirm('แทนที่ข้อมูลเดิมในเครื่องนี้ด้วยไฟล์สำรอง?')) return;
    state = data.state; save(); render(); toast('กู้คืนจากไฟล์สำรอง ' + state.assets.length + ' รายการแล้ว');
  } else toast('ไฟล์นี้ไม่ใช่ไฟล์ข้อมูลทะเบียนสินทรัพย์');
}
function backup(){
  const blob = new Blob([JSON.stringify({format:'fa-register-backup', version:1, saved:new Date().toISOString(), state})], {type:'application/json'});
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = 'asset-register-backup-' + today + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('#nav button'); if (nb){ state.view = nb.dataset.view; ui.resetArmed = false; save(); render(); return; }
  const fc = e.target.closest('[data-fcat]'); if (fc){ ui.fcat = fc.dataset.fcat; ui.limit = 48; render(); return; }
  const gc = e.target.closest('[data-gocat]'); if (gc){ ui.fcat = gc.dataset.gocat; ui.fbranch = ''; ui.q=''; ui.fstatus=''; ui.limit = 48; state.view = 'register'; render(); window.scrollTo(0,0); return; }
  const gb = e.target.closest('[data-gobranch]'); if (gb){ ui.fbranch = gb.dataset.gobranch; ui.fcat = ''; ui.q=''; ui.fstatus=''; ui.limit = 48; state.view = 'register'; render(); window.scrollTo(0,0); return; }
  const gv = e.target.closest('[data-goview]'); if (gv){ state.view = gv.dataset.goview; save(); render(); window.scrollTo(0,0); return; }
  const rg = e.target.closest('[data-reg]'); if (rg){ drawer = {mode:'form', id:null, pending:[], from:rg.dataset.reg}; renderDrawer(); updForm(); return; }
  const rj = e.target.closest('[data-rej]'); if (rj){ rejectPending(rj.dataset.rej); return; }
  const ub = e.target.closest('[data-unrej]'); if (ub){ const i = state.rejected.findIndex(p=>p.pid===ub.dataset.unrej); if (i>=0){ const p = state.rejected.splice(i,1)[0]; delete p.rejReason; delete p.rejDate; state.pending.push(p); save(); render(); toast('นำกลับเข้าคิวแล้ว'); } return; }
  const md = e.target.closest('[data-mode]'); if (md){ ui.mode = md.dataset.mode; render(); return; }
  const tr = e.target.closest('[data-open]'); if (tr){ openDrawer('detail', tr.dataset.open); return; }
  const pp = e.target.closest('[data-primary]'); if (pp && drawer){ const a = cur(); a.photos.forEach(p => p.primary = p.id === pp.dataset.primary); save(); renderDrawer(); render(); return; }
  const dp = e.target.closest('[data-delphoto]'); if (dp && drawer){ const a = cur(); a.photos = a.photos.filter(p => p.id !== dp.dataset.delphoto);
    if (a.photos.length && !a.photos.some(p=>p.primary)) a.photos[0].primary = true; save(); renderDrawer(); render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close-drawer') closeDrawer();
  else if (act === 'new') openDrawer('form', null);
  else if (act === 'new-pending') { drawer = {mode:'pnew', id:null, pending:[]}; renderDrawer(); }
  else if (act === 'save-pending') savePending();
  else if (act === 'to-cs') { const sel = $('#f-cat'); sel.value = 'CS'; sel.dispatchEvent(new Event('change', {bubbles:true})); }
  else if (act === 'count') saveCount();
  else if (act === 'edit') { drawer.mode = 'form'; renderDrawer(); }
  else if (act === 'transfer') { drawer.mode = 'transfer'; renderDrawer(); }
  else if (act === 'dispose') { drawer.mode = 'dispose'; renderDrawer(); updDispose(); }
  else if (act === 'capitalize') { drawer.mode = 'capitalize'; renderDrawer(); updCap(); }
  else if (act === 'back') { drawer.id ? (drawer.mode = 'detail', renderDrawer()) : closeDrawer(); }
  else if (act === 'save') saveForm();
  else if (act === 'do-transfer') doTransfer();
  else if (act === 'do-dispose') doDispose();
  else if (act === 'do-capitalize') doCapitalize();
  else if (act === 'more') { ui.limit += 48; render(); }
  else if (act === 'close') { const ym = ui.month; state.closed = state.closed.includes(ym) ? state.closed.filter(x=>x!==ym) : state.closed.concat(ym); save(); render(); toast(state.closed.includes(ym) ? 'ปิดงวด '+thMonth(ym)+' แล้ว' : 'เปิดงวดอีกครั้ง'); }
  else if (act === 'print-one') { if (cur().docNo){ printAssets([cur()]); return; } const n = Math.max(1, Math.min(200, parseInt($('#copies').value,10) || 1)); printAssets(Array(n).fill(cur())); }
  else if (act === 'print-filtered') { const rows = filtered(); const nLbl = rows.reduce((x,a) => x + pieces(a).length, 0); if (nLbl > 20 && !confirm('พิมพ์ป้าย ' + nLbl + ' ดวง?')) return; printAssets(rows); }
  else if (act === 'print-test') printAssets([state.assets[0] || {code:'OF2601/0001', name:'ป้ายทดสอบ เครื่องพิมพ์ NIIMBOT', branch:'สำนักงานใหญ่'}]);
  else if (act === 'backup') backup();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drawer) closeDrawer();
  if (e.key === 'Enter' && e.target.matches('tr[data-open]')) openDrawer('detail', e.target.dataset.open);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'asof' && t.value){ ui.asOf = t.value; render(); }
  else if (t.id === 'pq-q'){ ui.pq = t.value; const pos = t.selectionStart; render(); const q = $('#pq-q'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} }
  else if (t.id === 'q'){ ui.q = t.value; const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} }
  else if (t.id === 'month' && t.value){ ui.month = t.value; render(); }
  else if (t.dataset.life !== undefined){ const v = parseInt(t.value,10); if (v > 0){ state.cats[+t.dataset.life].life = v; save(); } }
  else if (t.id === 'threshold'){ state.threshold = +t.value || 0; save(); }
  else if (t.id === 'f-date' || t.id === 'f-cost' || t.id === 'f-qty' || t.id === 'f-doc'){ updForm(); }
  else if (t.id && t.id.startsWith('x-')) updDispose();
  else if (t.id === 'c-date') updCap();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'fcat'){ ui.fcat = t.value; render(); }
  else if (t.id === 'fbranch'){ ui.fbranch = t.value; ui.limit = 48; render(); }
  else if (t.id === 'fstatus'){ ui.fstatus = t.value; render(); }
  else if (t.id === 'pq-cat'){ ui.pqcat = t.value; render(); }
  else if (t.id === 'importfile' && t.files.length){ importFile(t.files[0]); t.value = ''; }
  else if (t.id === 'l-size'){ L().size = t.value; save(); }
  else if (t.id === 'l-type'){ L().type = +t.value; save(); }
  else if (t.id === 'l-task'){ L().task = t.value; save(); }
  else if (t.id === 'l-density'){ L().density = Math.max(1, Math.min(5, parseInt(t.value,10)||3)); t.value = L().density; save(); }
  else if (t.id === 'f-cat'){ $('#f-life').value = cat(t.value).life; $('#f-salv').value = cat(t.value).dep === false ? 0 : 1; updForm(); }
  else if (t.id === 'c-cat'){ $('#c-life').value = cat(t.value).life; updCap(); }
  else if (t.id === 'addphotos' && t.files.length){
    const a = cur(); const ps = await readPhotos(t.files); a.photos.push(...ps);
    if (!a.photos.some(p=>p.primary) && a.photos.length) a.photos[0].primary = true;
    a.history.push({date: today, text: 'เพิ่มรูปภาพ ' + ps.length + ' รูป'});
    if (!save()){ a.photos.splice(a.photos.length - ps.length); a.history.pop(); }
    renderDrawer(); render();
  }
  else if (t.id === 'formphotos' && t.files.length){
    const ps = await readPhotos(t.files); drawer.pending.push(...ps);
    $('#pendthumbs').querySelectorAll('.tw').forEach(n=>n.remove());
    $('#pendthumbs').insertAdjacentHTML('afterbegin', drawer.pending.map(p=>`<div class="tw"><img src="${p.src}" alt=""></div>`).join(''));
  }
});
const cur = () => state.assets.find(x => x.id === drawer.id);

function updForm(){
  if (!drawer || drawer.mode !== 'form') return;
  if (!drawer.id){ const c = $('#f-cat').value, d = $('#f-date').value || today, sup = !!cat(c).supply, doc = ($('#f-doc').value||'').trim().toUpperCase();
    $('#f-docwrap').hidden = !sup;
    $('#codepreview').textContent = sup ? (doc ? supCode(doc, parseInt($('#f-qty').value,10)||1).text : 'ใส่เลขที่เอกสาร AP / EXP') : nextCode(c, d); }
  const cost = +$('#f-cost').value, c = $('#f-cat').value, q = Math.max(1, parseInt($('#f-qty').value,10) || 1);
  $('#f-warn').innerHTML = cost && cat(c).dep !== false && cost / q < state.threshold ? `<div class="warnbox">ราคาต่อหน่วยต่ำกว่าเกณฑ์ ${fmt(state.threshold)} บาท ควรบันทึกเป็นวัสดุสิ้นเปลือง (1306000) แทนการลงทะเบียน${drawer.id?'':' <button type="button" class="btn sm" data-act="to-cs">เปลี่ยนเป็นวัสดุสิ้นเปลือง</button>'}</div>` : '';
}
function saveForm(){
  const name = $('#f-name').value.trim(), date = $('#f-date').value, cost = parseFloat($('#f-cost').value);
  const c = $('#f-cat').value, life = parseInt($('#f-life').value,10) || 0, salvage = parseFloat($('#f-salv').value) || 0;
  if (!name) return toast('กรอกชื่อสินทรัพย์');
  if (!date) return toast('เลือกวันที่ได้มา');
  if (!(cost > 0)) return toast('ราคาทุนต้องมากกว่า 0');
  if (cat(c).dep !== false && !(life > 0)) return toast('อายุการใช้งานต้องอย่างน้อย 1 ปี');
  if (salvage >= cost) return toast('มูลค่าซากต้องน้อยกว่าราคาทุน');
  const fields = {name, acqDate:date, cost, life, salvage, branch:addBranch($('#f-branch').value), custodian:$('#f-cust').value.trim(), vendor:$('#f-vendor').value.trim(),
    invoice:$('#f-inv').value.trim(), legacy:$('#f-legacy').value.trim(), note:$('#f-note').value.trim(),
    qty: Math.max(1, parseInt($('#f-qty').value,10) || 1), unit: $('#f-unit').value.trim() || 'ชิ้น'};
  if (drawer.id){
    const a = cur(); Object.assign(a, fields);
    if (drawer.pending.length){ a.photos.push(...drawer.pending); if (!a.photos.some(p=>p.primary)) a.photos[0].primary = true; }
    a.history.push({date: today, text: 'แก้ไขข้อมูล'});
    save(); drawer.mode = 'detail'; drawer.pending = []; renderDrawer(); render(); toast('บันทึกการแก้ไขแล้ว');
  } else {
    let sc = null;
    if (cat(c).supply){ const doc = ($('#f-doc').value||'').trim().toUpperCase(); if (!doc) return toast('ใส่เลขที่เอกสาร AP / EXP เพื่อตั้งรหัส'); sc = Object.assign(supCode(doc, fields.qty), {docNo: doc}); delete sc.text; }
    const a = Object.assign({id:uid(), code: nextCode(c, date), cat:c, status: cat(c).supply ? 'active' : cat(c).dep === false ? 'cip' : 'active', photos: drawer.pending, sample:false,
      history:[{date: today, text:'ลงทะเบียนสินทรัพย์'}]}, fields, linkPending(), sc || {});
    if (a.photos.length) a.photos[0].primary = true;
    state.assets.push(a);
    if (!save()){ state.assets.pop(); return; }
    drawer = {mode:'detail', id:a.id, pending:[]}; state.view = 'register'; render(); renderDrawer(); toast('ลงทะเบียน ' + codeText(a) + ' แล้ว');
  }
}
function doTransfer(){
  const a = cur(), br = $('#t-branch').value, cu = $('#t-cust').value.trim(), d = $('#t-date').value || today, n = $('#t-note').value.trim();
  a.history.push({date:d, text:`โอนจาก ${a.branch}${a.custodian?' ('+a.custodian+')':''} ไป ${br}${cu?' ('+cu+')':''}${n?' · '+n:''}`});
  a.branch = br; a.custodian = cu; save(); drawer.mode = 'detail'; renderDrawer(); render(); toast('บันทึกการโอนแล้ว');
}
function updDispose(){
  const box = $('#x-calc'); if (!box) return; const a = cur(), d = $('#x-date').value || today, p = parseFloat($('#x-proc').value) || 0;
  const acc = accDep(Object.assign({}, a, {disposal:null}), d), bv = r2(a.cost - acc), gl = r2(p - bv);
  box.innerHTML = `<dl class="facts"><div><dt>ราคาทุน</dt><dd>${fmt(a.cost)}</dd></div><div><dt>ค่าเสื่อมสะสมถึงวันจำหน่าย</dt><dd>${fmt(acc)}</dd></div>
    <div><dt>มูลค่าสุทธิ</dt><dd>${fmt(bv)}</dd></div><div><dt>${gl>=0?'กำไร':'ขาดทุน'}จากการจำหน่าย</dt><dd style="color:var(${gl>=0?'--good':'--bad'})">${fmt(Math.abs(gl))}</dd></div></dl>`;
}
function doDispose(){
  const a = cur(), d = $('#x-date').value, p = parseFloat($('#x-proc').value) || 0, k = $('#x-kind').value, ref = $('#x-ref').value.trim();
  if (!d || d < a.acqDate) return toast('วันที่จำหน่ายต้องไม่ก่อนวันที่ได้มา');
  a.status = 'disposed'; a.disposal = {date:d, proceeds:p, kind:k};
  a.history.push({date:d, text:`จำหน่าย (${k})${p?' รับเงิน '+fmt(p)+' บาท':''}${ref?' · '+ref:''}`});
  save(); drawer.mode = 'detail'; renderDrawer(); render(); toast(a.code + ' จำหน่ายแล้ว');
}
function updCap(){ const el = $('#c-code'); if (el) el.value = nextCode($('#c-cat').value, $('#c-date').value || today); }
function doCapitalize(){
  const a = cur(), c = $('#c-cat').value, d = $('#c-date').value, life = parseInt($('#c-life').value,10);
  if (!d || d < a.acqDate) return toast('วันที่พร้อมใช้ต้องไม่ก่อนวันเริ่มงาน');
  if (!(life > 0)) return toast('อายุการใช้งานต้องอย่างน้อย 1 ปี');
  const code = nextCode(c, d);
  const n = {id:uid(), code, cat:c, name:a.name.replace('งานก่อสร้าง','').trim() || a.name, branch:a.branch, custodian:a.custodian, vendor:a.vendor, invoice:a.invoice,
    acqDate:d, cost:a.cost, salvage:1, life, status:'active', photos:a.photos.map(p=>Object.assign({},p)), legacy:'', note:'', sample:false, fromCode:a.code,
    history:[{date:d, text:'โอนจากงานระหว่างก่อสร้าง ' + a.code}]};
  a.status = 'transferred'; a.transfer = {date:d, toCode:code}; a.history.push({date:d, text:'โอนเข้าสินทรัพย์ ' + code});
  state.assets.push(n); save(); drawer = {mode:'detail', id:n.id, pending:[]}; renderDrawer(); render(); toast('ออกรหัส ' + code + ' แล้ว');
}

boot();
})();
</script>
