<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ทะเบียนสินทรัพย์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky ledger bar with tabs, one working column, a right-side drawer for each asset */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#eaf0ee; --ink:#16211d; --muted:#5a6a64; --line:#dbe3e0;
  --accent:#1c6a56; --accent-ink:#ffffff; --accent-soft:#dfeee8;
  --good:#2b7a49; --warn:#9a5a12; --bad:#b03636; --warn-soft:#fbefdf; --bad-soft:#f9e4e4;
  --shadow:0 12px 40px rgba(20,40,34,.18);
  --BD-bg:#e9eaec; --BD-fg:#4a4f57; --OF-bg:#fbe3d3; --OF-fg:#a2521c; --FF-bg:#dcefd3; --FF-fg:#3d7a2a; --KT-bg:#d8e9f8; --KT-fg:#23639e; --VH-bg:#dce6ea; --VH-fg:#3f5f6b; --SW-bg:#e8def5; --SW-fg:#6a4a9a; --CP-bg:#f8dcdc; --CP-fg:#a33a3a; --CS-bg:#f4ecd0; --CS-fg:#7a6212;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --sunk:#1b2521; --ink:#e4ebe8; --muted:#97a6a0; --line:#2a3632;
  --accent:#62c2a2; --accent-ink:#0b1a15; --accent-soft:#1c3029;
  --good:#7fd09c; --warn:#e3a764; --bad:#f08c8c; --warn-soft:#33281a; --bad-soft:#3a2020;
  --shadow:0 12px 40px rgba(0,0,0,.5); --BD-bg:#262a30; --BD-fg:#c3c8d0; --OF-bg:#3a2a1f; --OF-fg:#f2b48a; --FF-bg:#22331d; --FF-fg:#a8d898; --KT-bg:#1c2b3a; --KT-fg:#9cc8f0; --VH-bg:#1f2b30; --VH-fg:#a9c5cf; --SW-bg:#2c2438; --SW-fg:#c9b2ef; --CP-bg:#3a2222; --CP-fg:#f0a3a3; --CS-bg:#33301c; --CS-fg:#e3d08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --sunk:#1b2521; --ink:#e4ebe8; --muted:#97a6a0; --line:#2a3632;
  --accent:#62c2a2; --accent-ink:#0b1a15; --accent-soft:#1c3029;
  --good:#7fd09c; --warn:#e3a764; --bad:#f08c8c; --warn-soft:#33281a; --bad-soft:#3a2020;
  --shadow:0 12px 40px rgba(0,0,0,.5); --BD-bg:#262a30; --BD-fg:#c3c8d0; --OF-bg:#3a2a1f; --OF-fg:#f2b48a; --FF-bg:#22331d; --FF-fg:#a8d898; --KT-bg:#1c2b3a; --KT-fg:#9cc8f0; --VH-bg:#1f2b30; --VH-fg:#a9c5cf; --SW-bg:#2c2438; --SW-fg:#c9b2ef; --CP-bg:#3a2222; --CP-fg:#f0a3a3; --CS-bg:#33301c; --CS-fg:#e3d08a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.demo-tag{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:99px}
main{padding-block:24px 64px;display:grid;gap:24px}
h1{font-size:24px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.spread{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:12px}
main>*{min-width:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi strong{display:block;font-size:clamp(17px,4.6vw,22px);overflow-wrap:anywhere;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.code{font-family:var(--f-mono);font-weight:600;font-size:13.5px;letter-spacing:.01em;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;background:var(--sunk)}
.ph{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;white-space:nowrap}
.p-active{background:var(--accent-soft);color:var(--accent)}
.p-cip{background:var(--warn-soft);color:var(--warn)}
.p-off{background:var(--sunk);color:var(--muted)}
.p-full{background:var(--bad-soft);color:var(--bad)}
.ex{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:500;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.alert{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.warnbox{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px 5px 5px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.chip .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.chip .ic svg{width:18px;height:18px}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.acard .meta{padding:10px}.acard .mrow b{font-size:13px}nav{flex-basis:100%;order:3}.brand span{display:none}}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;transition:border-color .15s, transform .15s}
.acard:hover{border-color:var(--accent);transform:translateY(-2px)}
.art{aspect-ratio:4/3;width:100%;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{width:40%;height:auto}
.art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.art .tag{position:absolute;top:10px;left:10px;font-family:var(--f-mono);font-weight:600;font-size:12.5px;background:var(--surface);color:var(--ink);padding:3px 8px;border-radius:6px;z-index:1}
.art .st{position:absolute;top:10px;right:10px;z-index:1}
.acard .meta{padding:12px 14px 14px;display:grid;gap:6px}
.acard .nm{font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.acard .br{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.acard .mrow small{font-size:12px;color:var(--muted)}
.acard .mrow b{font-weight:600;font-variant-numeric:tabular-nums}
.cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px}
.ctile{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ctile:hover{border-color:var(--accent)}
.ctile .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.ctile .ic svg{width:32px;height:32px}
.ctile .t{min-width:0;display:grid;gap:2px}
.ctile .t span{font-size:13px;color:var(--muted)}
.ctile .t strong{font-size:18px;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px}
.blist{display:grid;gap:12px}
.bitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px;cursor:pointer}
.bitem .meter{grid-column:1/-1;margin-top:0}
.bitem b{font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.more{display:flex;justify-content:center}
.heroart{border-radius:12px;aspect-ratio:auto;height:200px}
.heroart svg{width:26%}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.dbody{overflow-y:auto;padding:20px;display:grid;gap:20px;align-content:start}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
.bigcode{font-family:var(--f-mono);font-size:22px;font-weight:600}
.gallery{display:grid;gap:10px}
.mainimg{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:12px;background:var(--sunk);display:block}
.noimg{min-height:120px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px;background:var(--surface)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.tw{position:relative}
.tw img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block;border:2px solid transparent;cursor:pointer}
.tw.primary img{border-color:var(--accent)}
.tw .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--bad);font-size:13px;line-height:1;cursor:pointer;padding:0}
.upl{display:inline-flex;align-items:center;gap:6px}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
dl.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin:0}
dl.facts div{min-width:0}
dl.facts dt{font-size:12px;color:var(--muted)}
dl.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.label{display:flex;gap:12px;align-items:center;border:1px solid var(--ink);border-radius:6px;padding:10px 12px;width:min(340px,100%);background:#fff;color:#111}
.label .qr svg{width:84px;height:84px;display:block}
.label .t{display:grid;gap:2px;min-width:0}
.label .t small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#555}
.label .t b{font-family:var(--f-mono);font-size:17px}
.label .t span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px}
.hist li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.jv td:first-child{width:56px;color:var(--muted)}
.jv .cr td:nth-child(2){padding-left:32px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

.cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:2px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center}.cnt:empty{display:none}
.pqhead{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.pq td .note{font-size:12.5px}
.pq .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.prbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.prbtn i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.prbtn[data-state="on"] i{background:var(--good)}
.prbtn[data-state="busy"] i{background:var(--warn)}
.lblprev{display:block;width:min(340px,100%);height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;image-rendering:pixelated}
.prrow{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:10px}
.prrow .f{width:110px}
.empty{text-align:center;padding:40px 20px;display:grid;gap:12px;justify-items:center}
.empty h2{margin:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
</style>

</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><b>ทะเบียนสินทรัพย์</b><span>Fixed Asset Register</span></div>
    <nav id="nav">
      <button data-view="overview">ภาพรวม</button>
      <button data-view="register">ทะเบียน</button>
      <button data-view="pending">รอขึ้นทะเบียน <b class="cnt" id="pcnt"></b></button>
      <button data-view="dep">ค่าเสื่อมราคา</button>
      <button data-view="settings">ตั้งค่า</button>
    </nav>
    <span class="prbtn" id="sync" data-state="busy" title="สถานะการบันทึกลง Google Sheet"><i></i><span>กำลังโหลด…</span></span>
  </div>
</header>
<main class="wrap" id="app"><section class="card empty"><h2>กำลังเริ่มระบบ…</h2><p class="note" id="bootnote">ถ้าค้างที่ข้อความนี้นาน แคปหน้าจอส่งให้ผู้ดูแลระบบ</p></section></main>
<script>(function(){function show(t){var a=document.getElementById("app");if(a)a.innerHTML='<section class="card"><h2>เกิดข้อผิดพลาดในหน้าเว็บ</h2><p class="note">แคปหน้าจอนี้ส่งให้ผู้ดูแลระบบ</p><pre style="white-space:pre-wrap;font-size:12px">'+String(t).replace(/[<&]/g,function(c){return c=="<"?"&lt;":"&amp;";})+'</pre></section>';}window.addEventListener("error",function(e){show((e.message||e)+" @ "+e.lineno+":"+e.colno);});window.addEventListener("unhandledrejection",function(e){show("Promise: "+(e.reason&&e.reason.message||e.reason));});})();</script>
